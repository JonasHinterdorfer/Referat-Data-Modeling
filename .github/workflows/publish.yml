name: Publish Quarto to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Build Reveal.js and PDF
        run: |
          nix develop --command quarto render --to revealjs
          nix develop --command quarto render --to pdf

      - name: Build Redeskript
        run: |
          nix develop --command quarto pandoc index.qmd -f markdown \
            --lua-filter redeskript.lua \
            -M title="Redeskript: Data Modeling" \
            -V lang=de -V documentclass=scrartcl -V papersize=a4 \
            --pdf-engine=lualatex -o _site/script.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
